name: Publish to AUR

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH agent for AUR
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Publish PKGBUILD and .SRCINFO to AUR
        run: |
          git clone ssh://aur@aur.archlinux.org/fcitx5-ari-ime.git aur-pkg
          cp PKGBUILD .SRCINFO aur-pkg/
          cd aur-pkg
          git config user.name "kaiyasi"
          git config user.email "zengcode0315@gmail.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update to ${GITHUB_REF_NAME}"
            git push
          fi

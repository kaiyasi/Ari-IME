name: Binary release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  arch-x86_64:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build tools
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake extra-cmake-modules fcitx5 libchewing
          hicolor-icon-theme github-cli

      - uses: actions/checkout@v4

      - name: Verify tag and package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          cmake_version="$(sed -n 's/^project(inputer VERSION \([^ ]*\) LANGUAGES CXX).*/\1/p' CMakeLists.txt)"
          pkgbuild_version="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          srcinfo_version="$(sed -n 's/^[[:space:]]*pkgver = //p' .SRCINFO | head -n 1)"
          debian_version="$(sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p' debian/changelog)"
          wasm_version="$(sed -n 's/^[[:space:]]*\"version\": \"\([^\"]*\)\",/\1/p' wasm/package.json | head -n 1)"
          test "$version" = "$cmake_version"
          test "$version" = "$pkgbuild_version"
          test "$version" = "$srcinfo_version"
          test "$version" = "$debian_version"
          test "$version" = "$wasm_version"

      - name: Build Release package
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build-release --parallel

      - name: Create runtime archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="fcitx5-ari-ime-bin-${version}-x86_64.tar.zst"
          DESTDIR="$PWD/stage" cmake --install build-release
          strip --strip-unneeded stage/usr/lib/fcitx5/inputer.so
          tar --zstd -cf "$archive" -C stage usr
          sha256sum "$archive" > "$archive.sha256"
          printf 'ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$ARCHIVE" "$ARCHIVE.sha256"
          --repo "$GITHUB_REPOSITORY"
          --title "Ari IME $GITHUB_REF_NAME"
          --generate-notes

  debian-amd64:
    name: Debian/Ubuntu .deb
    runs-on: ubuntu-latest
    needs: arch-x86_64

    steps:
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            devscripts debhelper dpkg-dev build-essential cmake \
            extra-cmake-modules g++ pkg-config \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
            fcitx5-modules-dev libchewing3-dev hicolor-icon-theme

      - uses: actions/checkout@v4

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Upload Debian package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb="$(find .. -maxdepth 1 -type f -name 'fcitx5-ari-ime_*.deb' -print -quit)"
          test -n "$deb"
          sha256sum "$deb" > "$deb.sha256"
          latest_deb="fcitx5-ari-ime_amd64.deb"
          cp -- "$deb" "$latest_deb"
          sha256sum "$latest_deb" > "$latest_deb.sha256"
          gh release upload "$GITHUB_REF_NAME" \
            "$deb" "$deb.sha256" \
            "$latest_deb" "$latest_deb.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
